name: Build Repo Index

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

# 多个推送几乎同时到达时排队，而不是让两次索引重建互相把对方 push 掉
concurrency:
  group: repo-index
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild index and push
        uses: ./.github/actions/rebuild-index