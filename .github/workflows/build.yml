name: Validate Repo Index

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Regenerate and check index is up to date
        run: |
          python build_repo.py
          if ! git diff --quiet -- Packages Packages.gz Packages.bz2 Release; then
            echo "::warning::索引与 deb 不同步，请在本地执行 python build_repo.py 后重新提交"
          else
            echo "索引已是最新 ✅"
          fi
