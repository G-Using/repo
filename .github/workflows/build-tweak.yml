name: Build TGSaveAnywhere

on:
  workflow_dispatch:
    inputs:
      publish:
        description: '构建后把 deb 提交进 debs/（随后会重建源索引）'
        type: boolean
        default: true
  push:
    paths:
      - 'tgsaveanywhere/**'
      - '.github/workflows/build-tweak.yml'

permissions:
  contents: write

jobs:
  build-dylib:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app || true
          xcrun --sdk iphoneos --show-sdk-path || true

      - name: Install build deps
        run: brew install ldid dpkg xz 2>/dev/null || true

      - name: Install Theos
        run: |
          if [ ! -d "$HOME/theos" ]; then
            git clone --recursive --depth 1 https://github.com/theos/theos.git "$HOME/theos"
          fi

      - name: Build standalone dylib (TrollFools / 巨魔注入器)
        run: |
          export THEOS="$HOME/theos"
          export PATH="$THEOS/bin:$PATH"
          cd tgsaveanywhere
          make clean all TROLLSTORE=1 FINALPACKAGE=1
          mkdir -p out
          find . -type f -name "TGSaveAnywhere.dylib" -exec cp {} out/ \; || true
          ls -lh out/
          file out/TGSaveAnywhere.dylib || true

      - name: Upload dylib artifact
        uses: actions/upload-artifact@v4
        with:
          name: TGSaveAnywhere-dylib
          path: tgsaveanywhere/out/TGSaveAnywhere.dylib
          if-no-files-found: warn

  build:
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        scheme: [rootless, rootful]

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app || true
          xcrun --sdk iphoneos --show-sdk-path || true
          ls $(xcrun --sdk iphoneos --show-sdk-path) >/dev/null && echo "SDK OK"

      - name: Install build deps
        run: |
          brew install ldid dpkg xz 2>/dev/null || true
          command -v ldid dpkg-deb || true

      - name: Install Theos
        run: |
          if [ ! -d "$HOME/theos" ]; then
            git clone --recursive --depth 1 https://github.com/theos/theos.git "$HOME/theos"
          fi
          ls -d "$HOME/theos"

      - name: Build (${{ matrix.scheme }})
        run: |
          export THEOS="$HOME/theos"
          export PATH="$THEOS/bin:$PATH"
          cd tgsaveanywhere
          if [ "${{ matrix.scheme }}" = "rootless" ]; then
            make clean package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
          else
            make clean package FINALPACKAGE=1
          fi
          ls -lh packages/

      - name: Upload deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: TGSaveAnywhere-${{ matrix.scheme }}
          path: tgsaveanywhere/packages/*.deb
          if-no-files-found: warn

      - name: Publish to debs/
        if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.publish }}
        run: |
          mkdir -p debs
          cp tgsaveanywhere/packages/*.deb debs/
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add debs
          if git diff --cached --quiet; then
            echo "debs 无变化，跳过提交"
          else
            git commit -m "feat: TGSaveAnywhere (${{ matrix.scheme }}) deb"
            git pull --rebase origin main
            git push
          fi
