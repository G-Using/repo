name: Build TGSaveAnywhere

on:
  workflow_dispatch:
    inputs:
      publish:
        description: '构建后把 deb 提交进 debs/（随后会重建源索引）'
        type: boolean
        default: true
  push:
    paths:
      - 'tgsaveanywhere/**'
      - '.github/workflows/build-tweak.yml'

permissions:
  contents: write

jobs:
  build-dylib:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app || true
          xcrun --sdk iphoneos --show-sdk-path || true

      - name: Install build deps
        run: brew install ldid dpkg xz 2>/dev/null || true

      - name: Install Theos
        run: |
          if [ ! -d "$HOME/theos" ]; then
            git clone --recursive --depth 1 https://github.com/theos/theos.git "$HOME/theos"
          fi

      - name: Build standalone dylib (TrollFools / 巨魔注入器)
        run: |
          export THEOS="$HOME/theos"
          export PATH="$THEOS/bin:$PATH"
          cd tgsaveanywhere
          make clean all TROLLSTORE=1 FINALPACKAGE=1
          # 注意：必须精确复制 obj 根下的最终产物。
          # 不能用 find —— dSYM 包里也有一个同名的 DWARF 文件（filetype=MH_DSYM），
          # 复制错了 ldid 会报 "Unsupported Mach-O type"（踩过）。
          mkdir -p out
          cp ".theos/obj/TGSaveAnywhere.dylib" out/TGSaveAnywhere.dylib
          ldid -S out/TGSaveAnywhere.dylib
          ls -lh out/
          file out/TGSaveAnywhere.dylib
          shasum -a 256 out/TGSaveAnywhere.dylib | tee out/sha256.txt
          # file 输出必须是 dynamically linked shared library，不能是 dSYM companion
          if file out/TGSaveAnywhere.dylib | grep -qi "dSYM"; then
            echo "::error::产物是 dSYM companion 而不是 dylib！"; exit 1
          fi
          cd out && zip -q TGSaveAnywhere-dylib.zip TGSaveAnywhere.dylib sha256.txt && cd ..

      - name: Upload dylib artifact
        uses: actions/upload-artifact@v4
        with:
          name: TGSaveAnywhere-dylib
          path: |
            tgsaveanywhere/out/TGSaveAnywhere-dylib.zip
            tgsaveanywhere/out/TGSaveAnywhere.dylib
          if-no-files-found: warn

  build:
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        scheme: [rootless, rootful]

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app || true
          xcrun --sdk iphoneos --show-sdk-path || true
          ls $(xcrun --sdk iphoneos --show-sdk-path) >/dev/null && echo "SDK OK"

      - name: Install build deps
        run: |
          brew install ldid dpkg xz 2>/dev/null || true
          command -v ldid dpkg-deb || true

      - name: Install Theos
        run: |
          if [ ! -d "$HOME/theos" ]; then
            git clone --recursive --depth 1 https://github.com/theos/theos.git "$HOME/theos"
          fi
          ls -d "$HOME/theos"

      - name: Build (${{ matrix.scheme }})
        run: |
          export THEOS="$HOME/theos"
          export PATH="$THEOS/bin:$PATH"
          cd tgsaveanywhere
          if [ "${{ matrix.scheme }}" = "rootless" ]; then
            make clean package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
          else
            make clean package FINALPACKAGE=1
          fi
          ls -lh packages/

      - name: Upload deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: TGSaveAnywhere-${{ matrix.scheme }}
          path: tgsaveanywhere/packages/*.deb
          if-no-files-found: warn

  # 发布单独一个 job：原先写在 matrix 里，rootless / rootful 两个 job 会同时
  # commit + push debs/，必然有一个被拒。合并到这里一次提交就没这问题。
  publish:
    needs: [build-dylib, build]
    if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.publish }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect debs outside the repo
        run: |
          set -euo pipefail
          mkdir -p /tmp/newdebs
          find artifacts -name '*.deb' -type f -exec cp -n {} /tmp/newdebs/ \;
          ls -lh /tmp/newdebs/
          test -n "$(ls -A /tmp/newdebs)" || { echo "::error::没有产物 deb"; exit 1; }

      - name: Commit debs (retry against concurrent pushes)
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: github-actions[bot]@users.noreply.github.com
        run: |
          set -uo pipefail
          for attempt in 1 2 3 4 5; do
            # 每次都从远端重来：deb 文件已经存在 /tmp/newdebs，不会丢。
            # 这样"本地有陈旧索引 + 远端有新提交"永远不会变成需要人工解的冲突。
            git fetch origin main
            git reset --hard origin/main
            mkdir -p debs
            cp -n /tmp/newdebs/*.deb debs/ 2>/dev/null || true

            git add debs
            if git diff --cached --quiet; then
              echo "debs 无变化，跳过提交。"
              break
            fi
            git commit -m "feat: TGSaveAnywhere deb (rootless + rootful + dylib)"
            if git push; then
              echo "debs 推送成功。"
              break
            fi
            echo "::warning::debs push 被拒（第 ${attempt} 次），重新基于 origin/main 重试"
          done

      - name: Rebuild index and push
        uses: ./.github/actions/rebuild-index